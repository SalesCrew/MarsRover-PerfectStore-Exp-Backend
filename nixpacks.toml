[phases.setup]
aptPkgs = ["python3", "python3-pip", "python3-venv"]
nixPkgs = ["python3"]

[phases.install]
cmds = [
  "python3 --version",
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/python -m pip install --no-cache-dir -r requirements.txt"
]

[start]
cmd = "/opt/venv/bin/python -m uvicorn app:app --host 0.0.0.0 --port $PORT"
